version: '3.8'

services:
  # ─── FastAPI WebSocket Backend ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calltrust-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CallTrust Engine
      - DEBUG=true
      - MOCK_INFERENCE=true
      - PRIVACY_MODE=strict
      - AUDIT_LOG_ENABLED=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=calltrust
      - POSTGRES_USER=calltrust
      - POSTGRES_PASSWORD=calltrust_secret
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
      - ./ml/checkpoints:/app/ml/checkpoints
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # ─── React TypeScript Frontend ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calltrust-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Redis (Session State & Buffer Cache) ────────────
  redis:
    image: redis:7-alpine
    container_name: calltrust-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ─── PostgreSQL (Audit Log & Telemetry) ──────────────
  postgres:
    image: postgres:16-alpine
    container_name: calltrust-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: calltrust
      POSTGRES_USER: calltrust
      POSTGRES_PASSWORD: calltrust_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── Prometheus Monitoring ───────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: calltrust-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
